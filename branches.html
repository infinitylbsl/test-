<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Branch Portal - Infinity Laghubitta</title>
    
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- GLOBAL & HEADER --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { 
            --primary-blue: #004080; 
            --green: #00a86b;
            --secondary-green: #28a745;
            --admin-red: #dc3545;
            --white: #ffffff;
            --light-gray: #f8f9fa;
        }

        body { 
            font-family: Arial, sans-serif; 
            padding-top: 85px; 
            background-color: var(--light-gray); 
        }

        header {
            background: var(--primary-blue);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000;
        }

        .logo { width: 140px; }

        /* --- DIRECTORY STYLES --- */
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 20px; }

        .sub-nav-info {
            background: #fff;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .btn-it-login { background: var(--primary-blue); border: none; color: white; padding: 8px 15px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        
        .controls { display: flex; gap: 15px; margin-bottom: 2rem; }
        #searchBar { flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1rem; }
        
        .admin-only { display: none; }

        #admin-form {
            background: white; padding: 2rem; border-radius: 12px; margin-bottom: 2rem; border-left: 8px solid var(--secondary-green);
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-grid input { padding: 10px; border: 1px solid #ccc; border-radius: 5px; width: 100%; }

        .directory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 3px 10px rgba(0,0,0,0.08); display: flex; flex-direction: column; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-img { height: 180px; background: #eef2f7; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 18px; flex-grow: 1; }
        .card-content h3 { color: var(--primary-blue); margin-bottom: 8px; }
        .card-content p { font-size: 0.85rem; color: #555; margin: 4px 0; }
        
        .card-actions { padding: 15px; display: flex; gap: 10px; border-top: 1px solid #eee; background: #fafafa; }
        .btn-edit { background: #e7f1ff; color: var(--primary-blue); border: none; padding: 8px; flex: 1; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #fff1f0; color: var(--admin-red); border: none; padding: 8px; flex: 1; border-radius: 4px; cursor: pointer; }

        /* --- FOOTER (As Requested) --- */
        .footer-logo { width: 180px; margin-bottom: 15px; filter: brightness(0) invert(1); }
        .social-icon:hover { opacity: 0.7; transform: scale(1.1); transition: 0.3s; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo-link">
        <img src="logo111.png" class="logo" alt="Logo">
    </a>
    <div id="navbar-placeholder"></div>
</header>

<div class="container">
    <div class="sub-nav-info">
        <div style="font-weight: bold; color: var(--primary-blue); font-size: 1.2rem;">Branch Directory</div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <span id="it-status" style="font-size: 0.9rem; color: #666;">Mode: Viewer</span>
            <button class="btn-it-login" id="loginBtn" onclick="itLogin()">IT Login</button>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="searchBar" placeholder="Search by name, branch, or province..." onkeyup="filterData()">
        <button class="btn-it-login admin-only" style="background:var(--secondary-green);" onclick="toggleForm()">+ Add New Member</button>
    </div>

    <section id="admin-form" class="admin-only" style="display:none;">
        <h2 style="margin-bottom: 15px;">Member Management</h2>
        <input type="hidden" id="edit-index">
        <div class="form-grid">
            <input type="text" id="name" placeholder="Name">
            <input type="text" id="branch" placeholder="Branch">
            <input type="text" id="email" placeholder="Email">
            <input type="text" id="contact" placeholder="Contact">
            <input type="text" id="location" placeholder="Map Location">
            <input type="text" id="address" placeholder="Province">
            <input type="file" id="imgFile" accept="image/*">
            <input type="text" id="imgUrl" placeholder="Or Image URL">
        </div>
        <button style="background:var(--primary-blue); color:white; padding:10px 25px; border:none; border-radius:4px; cursor:pointer;" onclick="saveMember()">Save Member</button>
    </section>

    <div class="directory-grid" id="directory"></div>
</div>

<script>
    const IT_PASSWORD = "Itteam@#$";
    let isAdmin = false;
    
    // Member Data (Keep your full list here)
    const initialData = [
        {"name": "Shankar Singh Mahata", "branch": "Naubise,Dhadhing", "email": "naubise@infinitylbsl.com.np", "contact": "9862547302", "location": "Naubise,Dhadhing", "address": "Bagmati", "imgUrl": ""},
        {"name": "Krishna Baral", "branch": "Talchowk,Kaski", "email": "talchowk@infinitylbsl.com.np", "contact": "9862547303", "location": "Talchowk,Kaski", "address": "Gandaki", "imgUrl": ""}
    ]; 

    let peopleData = JSON.parse(localStorage.getItem('branchData')) || initialData;

    function itLogin() {
        if (!isAdmin) {
            const pass = prompt("Enter IT Secret Passcode:");
            if (pass === IT_PASSWORD) {
                isAdmin = true;
                document.getElementById('it-status').innerText = "Mode: IT Member";
                document.getElementById('loginBtn').innerText = "Logout IT";
            } else { alert("Incorrect Password."); }
        } else {
            isAdmin = false;
            document.getElementById('it-status').innerText = "Mode: Viewer";
            document.getElementById('loginBtn').innerText = "IT Login";
            document.getElementById('admin-form').style.display = 'none';
        }
        renderData(peopleData);
    }

    function renderData(dataToRender) {
        const container = document.getElementById('directory');
        container.innerHTML = '';
        const adminElements = document.querySelectorAll('.admin-only');
        adminElements.forEach(el => el.style.display = isAdmin ? 'block' : 'none');

        dataToRender.forEach((p, i) => {
            const realIndex = peopleData.indexOf(p);
            container.innerHTML += `
                <div class="card">
                    <div class="card-img">${p.imgUrl ? `<img src="${p.imgUrl}">` : '<span style="color:#aaa;">No Photo</span>'}</div>
                    <div class="card-content">
                        <h3>${p.name}</h3>
                        <p><b>Branch:</b> ${p.branch}</p>
                        <p><b>Email:</b> ${p.email}</p>
                        <p><b>Phone:</b> ${p.contact}</p>
                        <p><b>Province:</b> ${p.address}</p>
                    </div>
                    ${isAdmin ? `
                    <div class="card-actions">
                        <button class="btn-edit" onclick="editMember(${realIndex})">Edit</button>
                        <button class="btn-delete" onclick="deleteMember(${realIndex})">Delete</button>
                    </div>` : ''}
                </div>`;
        });
    }

    async function saveMember() {
        const idx = document.getElementById('edit-index').value;
        const fileInput = document.getElementById('imgFile');
        let imgResult = document.getElementById('imgUrl').value;

        if (fileInput.files && fileInput.files[0]) {
            imgResult = await toBase64(fileInput.files[0]);
        }

        const entry = {
            name: document.getElementById('name').value,
            branch: document.getElementById('branch').value,
            email: document.getElementById('email').value,
            contact: document.getElementById('contact').value,
            location: document.getElementById('location').value,
            address: document.getElementById('address').value,
            imgUrl: imgResult
        };

        if (idx === "") peopleData.unshift(entry);
        else peopleData[idx] = entry;

        localStorage.setItem('branchData', JSON.stringify(peopleData));
        clearForm();
        renderData(peopleData);
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = e => reject(e);
    });

    function editMember(idx) {
        const p = peopleData[idx];
        document.getElementById('name').value = p.name;
        document.getElementById('branch').value = p.branch;
        document.getElementById('email').value = p.email;
        document.getElementById('contact').value = p.contact;
        document.getElementById('address').value = p.address;
        document.getElementById('edit-index').value = idx;
        document.getElementById('admin-form').style.display = 'block';
        window.scrollTo(0,0);
    }

    function deleteMember(idx) {
        if(confirm("Delete this member?")) {
            peopleData.splice(idx, 1);
            localStorage.setItem('branchData', JSON.stringify(peopleData));
            renderData(peopleData);
        }
    }

    function filterData() {
        const term = document.getElementById('searchBar').value.toLowerCase();
        renderData(peopleData.filter(p => 
            p.name.toLowerCase().includes(term) || 
            p.branch.toLowerCase().includes(term)
        ));
    }

    function toggleForm() {
        const f = document.getElementById('admin-form');
        f.style.display = f.style.display === 'block' ? 'none' : 'block';
    }

    function clearForm() {
        document.querySelectorAll('#admin-form input').forEach(i => i.value = "");
        document.getElementById('edit-index').value = "";
    }

    function loadNavbar() {
        fetch("navbar.html")
          .then(res => res.text())
          .then(data => { document.getElementById("navbar-placeholder").innerHTML = data; })
          .catch(err => console.error("Navbar error:", err));
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadNavbar();
        renderData(peopleData);
    });
</script>
