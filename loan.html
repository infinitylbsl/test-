        /* --- GLOBAL & HOME PAGE BRANDING --- */
        :root {
            --blue: #004080;
            --green: #00a86b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding-top: 75px; /* Adjusts for fixed header */
            background: #f4f7f9;
        }

        /* --- HEADER & NAVIGATION CSS (FROM HOME PAGE) --- */
        header {
            background: var(--blue);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {

            transition: transform 0.3s ease;
        }

        .logo-link:hover .logo {
            transform: scale(1.1);
        }

        /* Styles for the fetched navbar items */
        #navbar-placeholder nav {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        #navbar-placeholder nav a {
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            font-size: 14px;
            transition: 0.3s;
        }

        #navbar-placeholder nav a:hover {
            background: var(--green);
            border-radius: 5px;
        }

        .menu-toggle {
            display: none;
            font-size: 26px;
            cursor: pointer;
            color: white;
        }

        /* Responsive Mobile Menu CSS from Home Page */
        @media(max-width:768px) {
            .menu-toggle { 
                display: block; 
            }

            #navbar-placeholder nav {
                display: none; /* Hidden by default on mobile */
                flex-direction: column;
                position: absolute;
                top: 65px;
                left: 0;
                width: 100%;
                background: var(--blue);
                text-align: center;
                padding: 10px 0;
            }

            #navbar-placeholder nav.active {
                display: flex; /* Shown when toggle is clicked */
            }

            #navbar-placeholder nav a {
                padding: 12px;
                display: block;
            }
        }

        /* --- LOAN FORM STYLES --- */
        .loan-hero {
            background: linear-gradient(to right, var(--blue), var(--green));
            color: white;
            text-align: center;
            padding: 40px 20px;
            margin-bottom: 30px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto 50px auto;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        h2 { color: var(--blue); margin-bottom: 25px; text-align: center; }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        input, select, textarea {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ddd;
            width: 100%;
            font-size: 15px;
        }

        textarea { grid-column: span 2; height: 100px; }

        .emi-box {
            background: #eef7ee;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0 20px 0;
            border-left: 5px solid var(--green);
            font-weight: bold;
            color: var(--blue);
        }

        button.apply-btn {
            background: var(--blue);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button.apply-btn:hover {
            background: var(--green);
        }

        /* --- FOOTER --- */
        footer {
            background: var(--blue);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        
        .social-icons a {
            margin: 0 10px;
            display: inline-block;
        }

        @media (max-width: 600px) {
            .row { grid-template-columns: 1fr; }
            .container { width: 95%; padding: 20px; }
        }
    </style>
</head>

<section class="loan-hero">

<div class="container">
    <h2>Application Details</h2>
    <form action="submit_loan.php" method="POST" enctype="multipart/form-data">

        <div class="row">
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="text" name="phone" placeholder="Phone Number" required>
        </div>

        <div class="row">
            <input type="email" name="email" placeholder="Email Address" required>
            <input type="text" name="citizenship" placeholder="Citizenship Number" required>
        </div>

        <div class="row">
            <select name="loan_type" required>
                <option value="">Select Loan Category</option>
                <option>Personal Loan</option>
                <option>Business Loan</option>
                <option>Agriculture Loan</option>
            </select>
            <input type="number" id="amount" name="amount" placeholder="Loan Amount (NPR)" oninput="calculateEMI()" required>
        </div>

        <div class="row">
            <input type="number" id="rate" placeholder="Interest Rate (%)" oninput="calculateEMI()">
            <input type="number" id="time" placeholder="Time (Years)" oninput="calculateEMI()">
        </div>

        <div class="emi-box" id="emi">Estimated Monthly EMI: NPR 0.00</div>

        <div class="row">
            <textarea name="address" placeholder="Full Address" required></textarea>
            <textarea name="purpose" placeholder="Loan Purpose" required></textarea>
        </div>

        <p style="font-weight:bold; color:#555; margin-bottom:5px;">Upload Documents (Citizenship/Legal Docs)</p>
        <input type="file" name="document" required style="border:none; padding:10px 0;">

        <button type="submit" class="apply-btn">Submit Application</button>

    </form>

<script>
    // EMI Calculator Logic
    function calculateEMI() {
        let amount = parseFloat(document.getElementById("amount").value);
        let rate = parseFloat(document.getElementById("rate").value) / 100 / 12;
        let time = parseFloat(document.getElementById("time").value) * 12;
        if (!amount || !rate || !time) {
            document.getElementById("emi").innerHTML = "Estimated Monthly EMI: NPR 0.00";
            return;
        }
        let emi = (amount * rate * Math.pow(1 + rate, time)) / (Math.pow(1 + rate, time) - 1);
        document.getElementById("emi").innerHTML = "Estimated Monthly EMI: NPR " + emi.toFixed(2);
    }

    // ✅ NAVBAR LOADER (Fetches the menu from navbar.html)
    function loadNavbar() {
        fetch("navbar.html")
            .then(response => {
                if (!response.ok) throw new Error("Navbar file not found");
                return response.text();
            })
            .then(data => {
                document.getElementById("navbar-placeholder").innerHTML = data;
            })
            .catch(err => console.error(err));
    }

    // Mobile Toggle Function
    function toggleMenu() {
        // Targets the 'nav' element usually found inside navbar.html
        const nav = document.querySelector("#navbar-placeholder nav");
        if (nav) {
            nav.classList.toggle("active");
        }
    }

    document.addEventListener("DOMContentLoaded", loadNavbar);
</script>
